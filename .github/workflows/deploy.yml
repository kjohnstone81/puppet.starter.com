name: Deploy

# Build the image, plan the infrastructure change, then wait for a human to
# approve before anything is applied. The approval gate is the `production`
# environment on the apply job — configure it with required reviewers under
# Settings -> Environments, or the job will apply without pausing.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: Why are you deploying?
        required: false
        default: Manual deploy

permissions:
  contents: read
  id-token: write # required to mint the OIDC token for Workload Identity Federation

# One deploy at a time. Queued runs wait rather than racing each other to
# apply conflicting plans, and an in-flight apply is never cancelled.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/booking-images/app:${{ github.sha }}
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/booking-images/app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin the image by digest
        run: |
          # Deploying by digest rather than tag means the revision Cloud Run
          # runs is exactly the artifact this job built, even if the tag moves.
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/booking-images/app@${{ steps.push.outputs.digest }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Built $IMAGE" >> "$GITHUB_STEP_SUMMARY"

  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform format check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: infra/terraform
        run: |
          terraform plan -out=tfplan -detailed-exitcode \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="region=${{ vars.GCP_REGION }}" \
            -var="firestore_location=${{ vars.FIRESTORE_LOCATION || 'eur3' }}" \
            -var="admin_email=${{ vars.ADMIN_EMAIL }}" \
            -var="custom_domain=${{ vars.CUSTOM_DOMAIN }}" \
            -var="public_base_url=${{ vars.PUBLIC_BASE_URL }}" \
            -var="image=${{ needs.build.outputs.image }}" \
          || exit_code=$?
          # -detailed-exitcode: 0 = no changes, 2 = changes present, 1 = error.
          # Only 1 is a failure.
          if [ "${exit_code:-0}" = "1" ]; then
            echo "terraform plan failed" >&2
            exit 1
          fi
          echo "has_changes=${exit_code:-0}" >> "$GITHUB_ENV"

      - name: Render the plan for review
        working-directory: infra/terraform
        run: |
          {
            echo "## Terraform plan"
            if [ "${has_changes}" = "2" ]; then
              echo "This deploy **will change infrastructure**. Review before approving."
            else
              echo "No infrastructure changes. Approving will deploy the new image only."
            fi
            echo
            echo '```terraform'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          # The apply job runs this exact file, so what a reviewer approves is
          # what gets applied — no re-planning against drifted state.
          path: infra/terraform/tfplan
          retention-days: 5
          if-no-files-found: error

  apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    needs: [build, plan]

    # THE MANUAL GATE. GitHub holds this job until a required reviewer on the
    # `production` environment approves it. Add reviewers under
    # Settings -> Environments -> production -> Required reviewers.
    environment:
      name: production
      url: ${{ steps.outputs.outputs.service_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Download the approved plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: infra/terraform

      - name: Terraform apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve tfplan

      - name: Capture outputs
        id: outputs
        working-directory: infra/terraform
        run: |
          SERVICE_URL="$(terraform output -raw service_url)"
          REDIRECT_URI="$(terraform output -raw oauth_redirect_uri)"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          {
            echo "## Deployed"
            echo "- Site: $SERVICE_URL"
            echo "- Image: \`${{ needs.build.outputs.image }}\`"
            echo "- OAuth redirect URI: \`$REDIRECT_URI\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        run: |
          SERVICE_URL="${{ steps.outputs.outputs.service_url }}"
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "$SERVICE_URL/api/healthz" > /dev/null; then
              echo "Health check passed."
              exit 0
            fi
            echo "Health check attempt $attempt failed; retrying in 10s."
            sleep 10
          done
          echo "The new revision did not become healthy." >&2
          exit 1
